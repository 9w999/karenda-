<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>プリントカレンダー</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');
 
    :root {
      --bg: #F5F3EE;
      --surface: #FFFFFF;
      --primary: #2D5A3D;
      --primary-light: #4A8B60;
      --accent: #E8A838;
      --danger: #D9534F;
      --text: #1A1A1A;
      --text-sub: #6B6B6B;
      --border: #E0DDD6;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --radius: 16px;
      --nav-h: 80px;
    }
 
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
 
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
 
    /* ── ローディング ── */
    #loading {
      position: fixed; inset: 0;
      background: var(--primary);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 999;
      transition: opacity 0.4s;
    }
    #loading .logo { font-size: 48px; margin-bottom: 12px; }
    #loading p { color: #fff; font-size: 14px; opacity: 0.8; }
    #loading.hidden { opacity: 0; pointer-events: none; }
 
    /* ── 画面共通 ── */
    .screen {
      display: none;
      padding-bottom: calc(var(--nav-h) + 16px);
      min-height: 100vh;
      animation: fadeIn 0.2s ease;
    }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
 
    /* ── ヘッダー ── */
    .header {
      background: var(--surface);
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .header h1 { font-size: 20px; font-weight: 700; color: var(--primary); }
    .header p  { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
 
    /* ── ボトムナビ ── */
    nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 20;
    }
    nav button {
      flex: 1; border: none; background: none;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 6px; cursor: pointer;
      color: var(--text-sub);
      font-family: inherit;
      font-size: 12px;
      transition: color 0.15s;
    }
    nav button .icon { font-size: 28px; }
    nav button.active { color: var(--primary); }
    nav button.active .icon { transform: scale(1.1); }
 
    /* ── カレンダー画面 ── */
    .cal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px;
    }
    .cal-header h2 { font-size: 18px; font-weight: 700; }
    .cal-header .nav-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 2px; padding: 0 12px 12px;
    }
    .cal-day-label {
      text-align: center; font-size: 11px;
      color: var(--text-sub); padding: 4px 0;
      font-weight: 500;
    }
    .cal-day-label:first-child { color: #D9534F; }
    .cal-day-label:last-child  { color: #4A90D9; }
    .cal-cell {
      aspect-ratio: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding-top: 6px; border-radius: 10px;
      cursor: pointer; position: relative;
      transition: background 0.15s;
    }
    .cal-cell:hover { background: var(--border); }
    .cal-cell.today .day-num {
      background: var(--primary);
      color: #fff; border-radius: 50%;
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
    }
    .cal-cell.other-month .day-num { color: #C0BDB8; }
    .cal-cell.sun .day-num { color: #D9534F; }
    .cal-cell.sat .day-num { color: #4A90D9; }
    .day-num { font-size: 13px; font-weight: 500; line-height: 1; }
    .dot-row { display: flex; gap: 2px; margin-top: 3px; }
    .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
 
    /* 予定リスト */
    .event-list { padding: 0 16px 8px; }
    .event-list h3 {
      font-size: 13px; color: var(--text-sub);
      margin-bottom: 8px; padding: 8px 4px 0;
      border-top: 1px solid var(--border);
    }
    .event-card {
      background: var(--surface);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: var(--shadow);
      border-left: 3px solid var(--primary);
    }
    .event-card .event-date {
      font-family: 'DM Mono', monospace;
      font-size: 11px; color: var(--text-sub);
      min-width: 72px;
    }
    .event-card .event-name { font-size: 14px; font-weight: 500; }
 
    /* ── タイムライン画面 ── */
    .timeline { padding: 12px 16px; }
    .tl-item {
      display: flex; gap: 12px;
      margin-bottom: 16px;
    }
    .tl-dot-col {
      display: flex; flex-direction: column; align-items: center;
    }
    .tl-dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--primary); flex-shrink: 0; margin-top: 4px;
    }
    .tl-line {
      width: 2px; flex: 1; background: var(--border);
      margin-top: 4px;
    }
    .tl-body {
      flex: 1; background: var(--surface);
      border-radius: 12px; padding: 12px 14px;
      box-shadow: var(--shadow);
    }
    .tl-body .tl-time { font-size: 11px; color: var(--text-sub); margin-bottom: 4px; }
    .tl-body .tl-text { font-size: 14px; line-height: 1.6; }
    .tl-empty { text-align: center; color: var(--text-sub); padding: 48px 0; font-size: 14px; }
 
    /* ── カメラ画面 ── */
    #screen-camera { background: #111; min-height: 100vh; }
    #screen-camera .cam-header {
      padding: 16px 20px;
      background: rgba(0,0,0,0.6);
      position: absolute; top: 0; left: 0; right: 0;
      z-index: 5;
    }
    #screen-camera .cam-header h1 { color: #fff; font-size: 18px; font-weight: 700; }
 
    /* ── 確認画面 ── */
    #confirm-screen {
      display: none; position: fixed; inset: 0;
      background: #000; z-index: 50;
      flex-direction: column;
    }
    #confirm-screen.active { display: flex; }
    #confirm-img {
      flex: 1; object-fit: contain; width: 100%;
    }
    .confirm-actions {
      background: #111;
      padding: 20px;
      display: flex; gap: 12px;
    }
    .btn {
      flex: 1; padding: 14px;
      border-radius: 12px; border: none;
      font-family: inherit; font-size: 15px;
      font-weight: 700; cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.75; }
    .btn-secondary { background: #333; color: #fff; }
    .btn-primary   { background: var(--primary); color: #fff; }
    .btn-danger    { background: var(--danger); color: #fff; }
 
    /* ファイル選択ボタン */
    .cam-select-wrap {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh; gap: 20px;
    }
    .cam-icon { font-size: 64px; opacity: 0.4; }
    .cam-select-wrap p { color: #aaa; font-size: 14px; }
    .cam-btn {
      background: var(--primary); color: #fff;
      border: none; border-radius: 14px;
      padding: 16px 32px; font-size: 16px;
      font-family: inherit; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; gap: 8px;
    }
    #file-input { display: none; }
 
    /* 送信中オーバーレイ */
    #sending-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); z-index: 100;
      flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
    }
    #sending-overlay.active { display: flex; }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #sending-overlay p { color: #fff; font-size: 15px; }
 
    /* トースト */
    #toast {
      position: fixed; bottom: 80px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #333; color: #fff;
      padding: 10px 20px; border-radius: 20px;
      font-size: 13px; opacity: 0;
      transition: all 0.3s; z-index: 200;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
 
<!-- ローディング -->
<div id="loading">
  <div class="logo">📚</div>
  <p>読み込み中...</p>
</div>
 
<!-- カレンダー画面 -->
<div id="screen-calendar" class="screen active">
  <div class="header">
    <h1>📅 カレンダー</h1>
    <p>プリントから取り込んだ予定</p>
  </div>
  <div class="cal-header">
    <button class="nav-btn" id="cal-prev">‹</button>
    <h2 id="cal-title"></h2>
    <button class="nav-btn" id="cal-next">›</button>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
  <div class="event-list" id="event-list"></div>
</div>
 
<!-- タイムライン画面 -->
<div id="screen-timeline" class="screen">
  <div class="header">
    <h1>🔔 タイムライン</h1>
    <p>お知らせ・通知の履歴</p>
  </div>
  <div class="timeline" id="timeline"></div>
</div>
 
<!-- カメラ画面 -->
<div id="screen-camera" class="screen">
  <div class="cam-select-wrap">
    <div class="cam-icon">📷</div>
    <p>プリントの写真を送ってください</p>
    <button class="cam-btn" onclick="document.getElementById('file-input').click()">
      📁 ファイルから選ぶ
    </button>
    <button class="cam-btn" style="background:#4A8B60" onclick="document.getElementById('camera-input').click()">
      📷 カメラで撮影
    </button>
    <input type="file" id="file-input" accept="image/*">
    <input type="file" id="camera-input" accept="image/*" capture="environment">
  </div>
</div>
 
<!-- 確認画面 -->
<div id="confirm-screen">
  <img id="confirm-img" src="" alt="確認画像">
  <div class="confirm-actions">
    <button class="btn btn-secondary" onclick="cancelConfirm()">← 戻る</button>
    <button class="btn btn-primary"   onclick="sendImage()">送信 →</button>
  </div>
</div>
 
<!-- 送信中オーバーレイ -->
<div id="sending-overlay">
  <div class="spinner"></div>
  <p id="sending-text">解析中...</p>
</div>
 
<!-- トースト -->
<div id="toast"></div>
 
<!-- ボトムナビ -->
<nav>
  <button class="nav-btn-item active" onclick="showScreen('calendar')" id="nav-calendar">
    <span class="icon">📅</span>カレンダー
  </button>
  <button class="nav-btn-item" onclick="showScreen('timeline')" id="nav-timeline">
    <span class="icon">🔔</span>タイムライン
  </button>
  <button class="nav-btn-item" onclick="showScreen('camera')" id="nav-camera">
    <span class="icon">📷</span>カメラ
  </button>
</nav>
 
<script>
  const SERVER_URL = 'https://kadaikenkyu.onrender.com';
  const LIFF_ID    = '2010280417-Py5foEYM';
 
  let liffProfile = null;
  let calYear, calMonth;
  let selectedDate = null;
  let pendingImageBlob = null;
  let events = []; // { name, start, end, allDay }
 
  // ── LIFF初期化 ──────────────────────────
  async function initLiff() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return; }
      liffProfile = await liff.getProfile();
      await loadEvents();
      renderCalendar();
    } catch (e) {
      console.error('LIFF初期化エラー:', e);
    }
  }
 
  // すぐに画面を表示
  document.addEventListener('DOMContentLoaded', () => {
    hideLoading();
    const now = new Date();
    calYear  = now.getFullYear();
    calMonth = now.getMonth();
    renderCalendar();
    renderTimeline();
    initLiff();
  });
 
  function hideLoading() {
    document.getElementById('loading').classList.add('hidden');
  }
 
  // ── 画面切替 ──────────────────────────
  function showScreen(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');
    document.getElementById('nav-' + name).classList.add('active');
  }
 
  // ── イベント取得 ──────────────────────────
  async function loadEvents() {
    if (!liffProfile) return;
    try {
      const res = await fetch(`${SERVER_URL}/events?userId=${liffProfile.userId}`);
      if (res.ok) {
        events = await res.json();
      }
    } catch (e) {
      console.warn('イベント取得失敗:', e.message);
      // サンプルデータ
      events = [];
    }
  }
 
  // ── カレンダー描画 ──────────────────────────
  function renderCalendar() {
    const title = `${calYear}年 ${calMonth + 1}月`;
    document.getElementById('cal-title').textContent = title;
 
    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';
 
    // 曜日ヘッダー
    ['日','月','火','水','木','金','土'].forEach(d => {
      const el = document.createElement('div');
      el.className = 'cal-day-label';
      el.textContent = d;
      grid.appendChild(el);
    });
 
    const first   = new Date(calYear, calMonth, 1).getDay();
    const days    = new Date(calYear, calMonth + 1, 0).getDate();
    const prevDays = new Date(calYear, calMonth, 0).getDate();
    const today   = new Date();
 
    // 前月の日
    for (let i = first - 1; i >= 0; i--) {
      grid.appendChild(makeCell(calYear, calMonth - 1, prevDays - i, true));
    }
    // 今月の日
    for (let d = 1; d <= days; d++) {
      grid.appendChild(makeCell(calYear, calMonth, d, false));
    }
    // 次月の日
    const total = first + days;
    const remain = total % 7 === 0 ? 0 : 7 - (total % 7);
    for (let d = 1; d <= remain; d++) {
      grid.appendChild(makeCell(calYear, calMonth + 1, d, true));
    }
 
    renderEventList(selectedDate);
  }
 
  function makeCell(y, m, d, other) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    const date = new Date(y, m, d);
    const dow  = date.getDay();
    if (other) cell.classList.add('other-month');
    if (dow === 0) cell.classList.add('sun');
    if (dow === 6) cell.classList.add('sat');
    const today = new Date();
    if (y === today.getFullYear() && m === today.getMonth() && d === today.getDate()) {
      cell.classList.add('today');
    }
 
    const num = document.createElement('div');
    num.className = 'day-num';
    num.textContent = d;
    cell.appendChild(num);
 
    // その日のイベント数をドットで表示
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayEvents = events.filter(e => e.start.startsWith(dateStr));
    if (dayEvents.length > 0) {
      const dots = document.createElement('div');
      dots.className = 'dot-row';
      dayEvents.slice(0, 3).forEach(() => {
        const dot = document.createElement('div');
        dot.className = 'dot';
        dots.appendChild(dot);
      });
      cell.appendChild(dots);
    }
 
    cell.addEventListener('click', () => {
      selectedDate = dateStr;
      renderEventList(dateStr);
    });
    return cell;
  }
 
  function renderEventList(dateStr) {
    const list = document.getElementById('event-list');
    const filtered = dateStr
      ? events.filter(e => e.start.startsWith(dateStr))
      : events.slice(0, 10);
 
    if (filtered.length === 0) {
      list.innerHTML = dateStr
        ? `<h3>${dateStr} の予定はありません</h3>`
        : '';
      return;
    }
 
    const label = dateStr || '予定一覧';
    list.innerHTML = `<h3>${label}</h3>`;
    filtered.forEach(ev => {
      const card = document.createElement('div');
      card.className = 'event-card';
      const time = ev.allDay ? '終日' : ev.start.slice(11, 16);
      card.innerHTML = `
        <div class="event-date">${time}</div>
        <div class="event-name">${ev.name}</div>
      `;
      list.appendChild(card);
    });
  }
 
  document.getElementById('cal-prev').onclick = () => {
    calMonth--;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
  };
  document.getElementById('cal-next').onclick = () => {
    calMonth++;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar();
  };
 
  // ── タイムライン描画 ──────────────────────────
  function renderTimeline() {
    const tl = document.getElementById('timeline');
    // サーバーから通知履歴を取得できる場合はここに追加
    tl.innerHTML = `<div class="tl-empty">📭 通知履歴はまだありません</div>`;
  }
 
  // ── カメラ・画像選択 ──────────────────────────
  document.getElementById('file-input').addEventListener('change', handleFileSelect);
  document.getElementById('camera-input').addEventListener('change', handleFileSelect);
 
  function handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    pendingImageBlob = file;
    const url = URL.createObjectURL(file);
    document.getElementById('confirm-img').src = url;
    document.getElementById('confirm-screen').classList.add('active');
    this.value = '';
  });
 
  function cancelConfirm() {
    document.getElementById('confirm-screen').classList.remove('active');
    pendingImageBlob = null;
  }
 
  async function sendImage() {
    if (!pendingImageBlob || !liffProfile) return;
    document.getElementById('confirm-screen').classList.remove('active');
    showSending('画像を解析中...');
 
    try {
      const formData = new FormData();
      formData.append('image', pendingImageBlob);
      formData.append('userId', liffProfile.userId);
 
      const res = await fetch(`${SERVER_URL}/upload`, {
        method: 'POST',
        body: formData,
      });
 
      if (!res.ok) throw new Error('サーバーエラー');
      const data = await res.json();
 
      hideSending();
      showToast('✅ カレンダーに追加しました');
      pendingImageBlob = null;
 
      // カレンダーを更新
      await loadEvents();
      renderCalendar();
      showScreen('calendar');
 
    } catch (e) {
      hideSending();
      showToast('❌ エラーが発生しました');
      console.error(e);
    }
  }
 
  function showSending(text) {
    document.getElementById('sending-text').textContent = text;
    document.getElementById('sending-overlay').classList.add('active');
  }
  function hideSending() {
    document.getElementById('sending-overlay').classList.remove('active');
  }
 
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }
 
  // ── 起動 ──────────────────────────
</script>
</body>
</html>
